[package]
name = "syncx-daemon"
description = "syncx 的会话状态机:扫描、传输规划、接收落地、冲突与版本。"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
syncx-core = { path = "../syncx-core" }
syncx-net = { path = "../syncx-net" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# ADR-0025 第 5 节:`bundled` 静态链接 SQLite,介质不依赖系统库;schema 与 Node 侧
# (`src/indexstore.ts`)完全一致。刻意不用 sqlx —— 同步 API + spawn_blocking 更简单。
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
# 文件系统监听(ADR-0025 第 5 节原本「有意不引入」,已按新决策推翻:轮询扫描保留为
# 定时兜底)。跨平台(inotify / FSEvents / ReadDirectoryChangesW)由 notify 保证。
# 配 notify-debouncer-full 而非 mini:full 带 FileIdMap,能把重命名成对事件缝合并剔除
# 重复 create —— 事件只当触发器,误报越少越好(扫描管线本身不便宜)。
# 两者版本必须配对:debouncer-full 0.7 依赖 notify 8.2,这里显式声明同源版本。
notify = "8.2"
notify-debouncer-full = "0.7"

[dev-dependencies]
# 端到端示例(`examples/rust_peer.rs`)要能被 Node 测试观察:开启 RUST_LOG 才有输出。
tracing-subscriber.workspace = true
